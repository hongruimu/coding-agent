[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "openai",
]

[tool.setuptools.packages.find]
include = [
    "agent*",
    "model*",
    "tools*",
    "cli*",
]

[project.scripts]
coding-agent = "cli.main:main"
